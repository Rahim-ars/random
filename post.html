
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Post on Randoms</title>
    
    <!-- Open Graph for rich previews -->
    <meta property="og:title" content="Post on Randoms">
    <meta property="og:description" content="Check out this post on Randoms!">
    <meta property="og:site_name" content="Randoms">
    
    <style>
        :root {
            --bg: #000000;
            --surface: #1a1a1a;
            --text: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-tertiary: rgba(255, 255, 255, 0.45);
            --primary: #6366f1;
            --red: #ef4444;
            --divider: rgba(255, 255, 255, 0.08);
            --dot-inactive: rgba(255, 255, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--bg);
        }

        /* ── Top Banner ──────────────────────────── */
        .app-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--surface);
            border-bottom: 0.5px solid var(--divider);
        }
        .app-banner-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .app-logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
            color: white;
        }
        .app-name {
            font-weight: 700;
            font-size: 16px;
        }
        .app-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .get-app-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
        }
        .get-app-btn:hover {
            opacity: 0.9;
        }

        /* ── Post Header ─────────────────────────── */
        .post-header {
            display: flex;
            align-items: center;
            padding: 10px 16px 6px 16px;
            gap: 10px;
        }
        .avatar-wrapper {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, #9C27B0, #6A1B9A);
            flex-shrink: 0;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: white;
            overflow: hidden;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .header-info {
            flex: 1;
            min-width: 0;
        }
        .username {
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .verified-badge {
            color: #3b82f6;
            font-size: 14px;
        }
        .timestamp {
            font-size: 11px;
            color: var(--text-tertiary);
            flex-shrink: 0;
        }
        .more-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            flex-shrink: 0;
        }

        /* ── Caption ──────────────────────────────── */
        .caption {
            padding: 4px 16px 8px 16px;
            font-size: 13px;
            line-height: 1.5;
            color: var(--text);
        }
        .caption.collapsed {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .more-less {
            color: var(--text-tertiary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 4px;
            display: inline-block;
        }

        /* ── Media ────────────────────────────────── */
        .media-container {
            width: 100%;
            background: var(--surface);
            position: relative;
        }
        .media-container img,
        .media-container video {
            width: 100%;
            display: block;
            max-height: 500px;
            object-fit: cover;
        }
        .page-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            background: rgba(26, 26, 26, 0.75);
            padding: 6px 14px;
            border-radius: 20px;
        }
        .page-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--dot-inactive);
        }
        .page-dot.active {
            background: var(--primary);
        }

        /* ── Actions ──────────────────────────────── */
        .actions {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 4px;
        }
        .action-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 8px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            border-radius: 8px;
            transition: background 0.15s;
        }
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .action-btn svg {
            width: 24px;
            height: 24px;
        }
        .spacer {
            flex: 1;
        }

        /* ── Play Store Overlay ───────────────────── */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .overlay.show {
            display: flex;
        }
        .overlay-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 32px 24px;
            text-align: center;
            max-width: 340px;
            width: 90%;
        }
        .overlay-card h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }
        .overlay-card p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .overlay-card .download-btn {
            display: block;
            background: var(--primary);
            color: white;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 12px;
        }
        .overlay-card .cancel-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            padding: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- ── App Download Banner ──────────────────── -->
        <div class="app-banner">
            <div class="app-banner-left">
                <div class="app-logo">R</div>
                <div>
                    <div class="app-name">Randoms</div>
                    <div class="app-subtitle">See more on the app</div>
                </div>
            </div>
            <a class="get-app-btn" href="https://play.google.com/store/apps/details?id=com.ras.androidzing" target="_blank">
                Get App
            </a>
        </div>

        <!-- ── Post Header ──────────────────────────── -->
        <div class="post-header">
            <div class="avatar-wrapper">
                <div class="avatar" id="avatar">
                    <span id="avatar-initial">U</span>
                </div>
            </div>
            <div class="header-info">
                <div class="username">
                    <span id="username-display">username</span>
                    <span class="verified-badge" id="verified-badge" style="display:none;">✓</span>
                </div>
            </div>
            <span class="timestamp" id="timestamp">2h</span>
            <button class="more-btn" onclick="showPlayStore()">⋮</button>
        </div>

        <!-- ── Caption ──────────────────────────────── -->
        <div class="caption collapsed" id="caption">
            <span id="caption-text">This is an example caption for the post.</span>
            <span class="more-less" id="more-less-btn" onclick="toggleCaption()">more</span>
        </div>

        <!-- ── Media ────────────────────────────────── -->
        <div class="media-container" id="media-container">
            <img id="post-media" src="https://via.placeholder.com/500x500/1a1a1a/6366f1?text=Post+Image" alt="Post image">
            <div class="page-dots" id="page-dots" style="display:none;">
                <span class="page-dot active"></span>
                <span class="page-dot"></span>
                <span class="page-dot"></span>
            </div>
        </div>

        <!-- ── Action Buttons ────────────────────────── -->
        <div class="actions">
            <button class="action-btn" onclick="showPlayStore()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
                <span id="likes-count">1.2K</span>
            </button>
            <button class="action-btn" onclick="showPlayStore()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <span id="comments-count">89</span>
            </button>
            <button class="action-btn" onclick="showPlayStore()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
                <span id="shares-count">45</span>
            </button>
            <span class="spacer"></span>
            <button class="action-btn" onclick="showPlayStore()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                </svg>
            </button>
        </div>

    </div>

    <!-- ── Play Store Overlay ──────────────────────── -->
    <div class="overlay" id="playstore-overlay">
        <div class="overlay-card">
            <h2>📱 Get the Randoms App</h2>
            <p>Like, comment, and interact with posts on the full Randoms experience.</p>
            <a class="download-btn" href="https://play.google.com/store/apps/details?id=com.ras.androidzing" target="_blank">
                Download on Google Play
            </a>
            <button class="cancel-btn" onclick="hidePlayStore()">Not now</button>
        </div>
    </div>

    <script>
        // ── Try to open the app automatically ──────────
        (function() {
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id') || 'demo';
            const deepLink = 'randomsapp://post/' + postId;
            
            // Try to open the app
            window.location.href = deepLink;
        })();

        // ── Functions ──────────────────────────────────
        function showPlayStore() {
            document.getElementById('playstore-overlay').classList.add('show');
        }

        function hidePlayStore() {
            document.getElementById('playstore-overlay').classList.remove('show');
        }

        function toggleCaption() {
            const caption = document.getElementById('caption');
            const btn = document.getElementById('more-less-btn');
            if (caption.classList.contains('collapsed')) {
                caption.classList.remove('collapsed');
                btn.textContent = 'less';
            } else {
                caption.classList.add('collapsed');
                btn.textContent = 'more';
            }
        }

        // ── You can set post data via URL params ────────
        function loadPostData() {
            const params = new URLSearchParams(window.location.search);
            
            if (params.get('username')) {
                document.getElementById('username-display').textContent = params.get('username');
                document.getElementById('avatar-initial').textContent = 
                    params.get('username').charAt(0).toUpperCase();
            }
            if (params.get('caption')) {
                document.getElementById('caption-text').textContent = params.get('caption');
            }
            if (params.get('likes')) {
                document.getElementById('likes-count').textContent = params.get('likes');
            }
            if (params.get('comments')) {
                document.getElementById('comments-count').textContent = params.get('comments');
            }
            if (params.get('shares')) {
                document.getElementById('shares-count').textContent = params.get('shares');
            }
            if (params.get('media')) {
                document.getElementById('post-media').src = params.get('media');
            }
            if (params.get('avatar')) {
                const avatarDiv = document.getElementById('avatar');
                avatarDiv.innerHTML = '<img src="' + params.get('avatar') + '" alt="avatar">';
            }
            if (params.get('time')) {
                document.getElementById('timestamp').textContent = params.get('time');
            }
        }

        loadPostData();
    </script>
</body>
</html>
